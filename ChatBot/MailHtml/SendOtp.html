<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title></title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body {
            font-size: 14px;
            margin: 0;
            padding: 0;
        }

        @media only screen and (max-width: 600px) {
            .email-card {
                padding: 20px 16px !important;
            }
        }
    </style>
</head>
<body>

    <table width="100%" cellpadding="0" cellspacing="0">
        <tbody>
            <tr>
                <td>

                    <table width="100%" cellpadding="0" cellspacing="0" style="font-family: arial; font-size: 14px; line-height: 22px; color: rgb(81, 84, 94); width: 100%;" class="fr-table-selection-hover">
                        <tbody>
                            <tr>
                                <td style="font-size: 16px;font-weight: bold;color: #A8AAAF;text-decoration: none;text-shadow: 0 1px 0 white;padding: 25px 0;text-align: center;"><a href="https://icare.life" class="f-fallback email-masthead_name" target="_blank">&nbsp;{{product_name}}&nbsp;</a></td>
                            </tr>
                            <tr>
                                <td cellpadding="0" cellspacing="0" style="width: 100%;">

                                    <table align="center" width="100%" cellpadding="0" cellspacing="0" style="max-width: 570px; width: 100%;">
                                        <tbody>
                                            <tr>
                                                <td>
                                                    <div class="email-card" style="width: 100%;max-width: 500px;box-sizing: border-box;margin: 0 auto;padding: 0;background-color: #F4F4F7;-webkit-box-shadow: 0px 0px 10px -2px rgba(0,0,0,0.75);-moz-box-shadow: 0px 0px 10px -2px rgba(0,0,0,0.75);box-shadow: 0px 0px 10px -2px rgba(0,0,0,0.75);padding: 24px;">

                                                        <h1 style="margin-top: 0;color: #000;font-size: 16px;font-weight: bold;text-align: left;">Dear {{name}},</h1>

                                                        <p style="color: #51545E;margin: .4em 0 1.1875em;font-size: 14px;line-height: 1.625;word-break: normal;overflow-wrap: break-word;">Your one time password is <span style="font-weight: bold;">&nbsp;{{otp}} and is valid for 2 minutes.</span> DO NOT share this with anyone.</p>

                                                        <p style="color: #51545E;margin: .4em 0 1.1875em;font-size: 14px;line-height: 1.625;">
                                                            Thanks,
                                                            <br />{{product_name}} Team
                                                        </p>
                                                    </div>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
